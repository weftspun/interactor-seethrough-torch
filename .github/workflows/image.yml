name: image

# Builds the linux/amd64 runtime image and pushes it to GHCR.
# Native amd64 runner on purpose: cross-building multi-GB cu128 torch wheels
# under qemu from arm64 is slow and fragile.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &image_paths
      - 'Dockerfile'
      - 'inference/**'
      - 'common/**'
      - 'annotators/**'
      - 'requirements.txt'
      - '.github/workflows/image.yml'
  # Build (but do not publish) on PRs, so a Dockerfile change is proven
  # before it reaches main. GHCR push is gated below on event type.
  pull_request:
    paths: *image_paths

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The torch cu128 wheels alone are several GB; the default runner disk
      # is not generous. Reclaim before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: this image is >10GB and GHA cache caps at 10GB per
          # repo, so mode=max spends longer exporting cache than building.
          cache-to: type=gha,mode=min
